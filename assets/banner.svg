<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 52px;
        fill: url(#titleGrad);
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #e2e8f0;
      }
      
      /* Standard CSS Animation for dynamic movement without broken SVG attributes */
      @keyframes floatGrid {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(-8px); opacity: 0.5; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseScale {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }
      
      .bg-grid {
        animation: floatGrid 6s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 8;
        animation: dashFlow 2s linear infinite;
      }
      .pulse-circle {
        transform-origin: 180px 120px;
        animation: pulseScale 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Dynamic Grid -->
  <g class="bg-grid" stroke="#334155" stroke-width="1" opacity="0.3">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Dynamic Data Reconciliation Nodes & Flow Lines (Right Side Background) -->
  <g transform="translate(750, 60)">
    <!-- Connection Paths -->
    <path d="M 50 60 L 180 120 L 300 60" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M 50 180 L 180 120 L 300 180" stroke="#818cf8" stroke-width="3" fill="none" opacity="0.5"/>
    <path class="flow-line" d="M 50 60 L 180 120 L 300 180" stroke="#c084fc" stroke-width="2" fill="none"/>
    <path class="flow-line" d="M 50 180 L 180 120 L 300 60" stroke="#38bdf8" stroke-width="2" fill="none"/>

    <!-- Data Nodes -->
    <!-- Source A -->
    <rect x="10" y="40" width="80" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="50" y="65" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">Source A</text>

    <!-- Source B -->
    <rect x="10" y="160" width="80" height="40" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="50" y="185" text-anchor="middle" fill="#818cf8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">Source B</text>

    <!-- Reconciliation Engine -->
    <circle cx="180" cy="120" r="36" fill="#0f172a" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/>
    <text x="180" y="115" text-anchor="middle" fill="#c084fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">RECON</text>
    <text x="180" y="130" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="10">ENGINE</text>

    <!-- Matched Output -->
    <rect x="260" y="40" width="90" height="40" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="305" y="65" text-anchor="middle" fill="#22c55e" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">Matched</text>

    <!-- Exception Output -->
    <rect x="260" y="160" width="90" height="40" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="305" y="185" text-anchor="middle" fill="#ef4444" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">Breaks</text>

    <!-- Glowing Pulse Circle -->
    <circle class="pulse-circle" cx="180" cy="120" r="6" fill="#c084fc"/>
  </g>

  <!-- Foreground Main Title & Subtitle (Clean & Accessible) -->
  <g transform="translate(60, 110)">
    <!-- Decorative Tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="110" y="18" text-anchor="middle" class="badge-text">CURATED ECOSYSTEM</text>

    <!-- Title -->
    <text x="0" y="80" class="title">Awesome Data Reconciliation</text>

    <!-- Subtitle -->
    <text x="0" y="120" class="subtitle">Transaction Matching, Account Recon, ETL Validation &amp; Data Quality</text>
    <text x="0" y="148" font-family="Segoe UI, sans-serif" font-size="15" fill="#64748b">
      Enterprise SaaS Platforms • Open-Source Frameworks • Automated Financial Controls
    </text>
  </g>
</svg>
